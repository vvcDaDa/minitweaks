# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/26.3'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: download build artifact
        uses: actions/download-artifact@v8
        with:
          name: Artifacts
      - name: release 2.0.2
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view 2.0.2 >/dev/null 2>&1; then
            gh release upload 2.0.2 minitweaks-2.0.2.jar --clobber
            gh release edit 2.0.2 --title "2.0.2" --notes "Updated to 26.3"
          else
            gh release create 2.0.2 minitweaks-2.0.2.jar --target "$GITHUB_SHA" --title "2.0.2" --notes "Updated to 26.3"
          fi



